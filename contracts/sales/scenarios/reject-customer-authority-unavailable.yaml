schema_version: "1.0"
kind: scenario
id: sales.create-order-draft.reject-customer-authority-unavailable
version: "3.0.1"
status: candidate
summary: An unavailable Customer authority prevents Order creation and MUST NOT be reported as a missing or unauthorized Customer.

contract_refs:
  - sales.create-order-draft
  - customer.verify-order-authority
  - sales.order.must-belong-to-verified-customer
  - sales.order-draft-created

given:
  facts:
    - path: customer.verify-order-authority.availability
      operator: equals
      value: no-authoritative-decision
    - path: customer.customers.customer-1001
      operator: exists
      value: true
    - path: orders
      operator: count_equals
      value: 0

when:
  command_ref: sales.create-order-draft
  input:
    command_id: command-create-unavailable-001
    actor_id: actor-1001
    customer_id: customer-1001
    currency: USD

then:
  outcome:
    status: failure
    code: CUSTOMER_AUTHORITY_UNAVAILABLE
  state:
    assertions:
      - path: orders
        operator: count_equals
        value: 0
  events:
    assertions:
      - event_ref: sales.order-draft-created
        count: 0
  forbidden:
    - kind: side_effect
      description: Sales MUST NOT allocate an Order ID or create an Order.
    - kind: side_effect
      description: Sales MUST NOT report CUSTOMER_NOT_FOUND or CUSTOMER_NOT_AUTHORIZED for a Customer whose authority could not be decided.
    - kind: event
      event_ref: sales.order-draft-created
      description: OrderDraftCreated MUST NOT occur.
