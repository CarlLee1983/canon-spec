schema_version: "1.0"
kind: scenario
id: sales.submit-order.reject-empty
version: "3.0.1"
status: candidate
summary: An empty Order Draft is rejected without state, total, or Event changes.

contract_refs:
  - sales.submit-order
  - sales.order.submitted-must-have-items
  - sales.order-submitted

given:
  facts:
    - path: orders.order-1001.state
      operator: equals
      value: draft
    - path: orders.order-1001.items
      operator: count_equals
      value: 0
    - path: orders.order-1001.total.amount_minor
      operator: equals
      value: 0

when:
  command_ref: sales.submit-order
  input:
    command_id: command-submit-empty-001
    order_id: order-1001

then:
  outcome:
    status: failure
    code: ORDER_EMPTY
  state:
    assertions:
      - path: orders.order-1001.state
        operator: equals
        value: draft
      - path: orders.order-1001.items
        operator: count_equals
        value: 0
      - path: orders.order-1001.total.amount_minor
        operator: equals
        value: 0
  events:
    assertions:
      - event_ref: sales.order-submitted
        count: 0
  forbidden:
    - kind: state_change
      path: orders.order-1001.state
      description: Order state MUST NOT change.
    - kind: state_change
      path: orders.order-1001.total
      description: Order total MUST NOT change.
    - kind: event
      event_ref: sales.order-submitted
      description: OrderSubmitted MUST NOT occur.
