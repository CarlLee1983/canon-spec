schema_version: "1.0"
kind: scenario
id: sales.submit-order.reject-concurrent-modification
version: "3.0.0"
status: draft
summary: A Submit Order Command that loses a concurrent race leaves the Order unchanged and creates no OrderSubmitted occurrence.

contract_refs:
  - sales.submit-order
  - sales.order.concurrent-commands-do-not-interleave
  - sales.order.single-order-submitted-event
  - sales.order-submitted

given:
  facts:
    - path: orders.order-1001.state
      operator: equals
      value: draft
    - path: orders.order-1001.items
      operator: count_equals
      value: 1
    - path: sales.concurrent-command-in-flight.order-1001
      operator: equals
      value: command-submit-concurrent-001

when:
  command_ref: sales.submit-order
  input:
    command_id: command-submit-concurrent-002
    order_id: order-1001

then:
  outcome:
    status: failure
    code: ORDER_CONCURRENT_MODIFICATION
  state:
    assertions:
      - path: orders.order-1001.state
        operator: equals
        value: draft
      - path: orders.order-1001.items
        operator: count_equals
        value: 1
  events:
    assertions:
      - event_ref: sales.order-submitted
        count: 0
  forbidden:
    - kind: state_change
      path: orders.order-1001.state
      description: The Order state MUST NOT change for the Command that does not take effect.
    - kind: event
      event_ref: sales.order-submitted
      description: OrderSubmitted MUST NOT occur more than once for one Order.
