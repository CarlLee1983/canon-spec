schema_version: "1.0"
kind: scenario
id: sales.add-order-item.free-item-success
version: "3.0.1"
status: accepted
summary: A valid zero-priced Quote appends a distinct Item while leaving the Order total unchanged.

contract_refs:
  - sales.add-order-item
  - pricing.quote-order-item
  - sales.order.item-price-must-not-be-negative
  - sales.order.item-must-have-unique-id
  - sales.order.item-additions-do-not-merge
  - sales.order-item-added

given:
  facts:
    - path: orders.order-1001.state
      operator: equals
      value: draft
    - path: orders.order-1001.currency
      operator: equals
      value: USD
    - path: orders.order-1001.items
      operator: count_equals
      value: 1
    - path: orders.order-1001.total.amount_minor
      operator: equals
      value: 922
    - path: pricing.quotes.quote-free
      operator: equals
      value: "product product-free, quantity 1, unit each, unit price 0 USD, item subtotal 0 minor units, valid"
    - path: sales.next-allocated-order-item-id
      operator: equals
      value: item-1003

when:
  command_ref: sales.add-order-item
  input:
    command_id: command-add-free-001
    order_id: order-1001
    product_id: product-free
    price_quote_id: quote-free
    quantity: "1"

then:
  outcome:
    status: success
    code: ORDER_ITEM_ADDED
  state:
    assertions:
      - path: orders.order-1001.items
        operator: count_equals
        value: 2
      - path: orders.order-1001.items.item-1003.item_subtotal.amount_minor
        operator: equals
        value: 0
      - path: orders.order-1001.total.amount_minor
        operator: equals
        value: 922
  events:
    assertions:
      - event_ref: sales.order-item-added
        count: 1
        payload:
          order_id: order-1001
          order_item_id: item-1003
          item_subtotal_amount_minor: 0
          order_total_amount_minor: 922
  forbidden:
    - kind: side_effect
      description: A zero-priced Item MUST NOT be rejected solely because its Unit Price and subtotal are zero.
    - kind: state_change
      path: orders.order-1001.total
      description: Adding the zero subtotal MUST NOT change Order total.
    - kind: side_effect
      description: The free Item MUST NOT merge with an existing Item.
