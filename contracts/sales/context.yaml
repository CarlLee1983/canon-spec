schema_version: "1.0"
kind: context
id: sales
version: "3.0.0"
status: draft

summary: Sales MUST own the Order lifecycle and preserve Customer and Pricing evidence without assuming behavior owned by other Contexts.

responsibilities:
  includes:
    - Sales MUST create Order Drafts only after Customer confirms that the actor may act for the Customer.
    - Sales MUST allocate Order and Order Item identities.
    - Sales MUST add distinct Order Items only from authoritative Pricing Quotes.
    - Sales MUST preserve quoted quantities, Units of Measure, Price Snapshots, Item subtotals, and the Order currency.
    - Sales MUST submit eligible Orders.
    - Sales MUST cancel Order Drafts before submission.
    - Sales MUST protect Order lifecycle and Command idempotency invariants.
    - Sales MUST produce the Domain Events listed by this Context.
  excludes:
    - Sales MUST NOT own product master data.
    - Sales MUST NOT determine live prices, Quantity precision, Units of Measure, or monetary rounding.
    - Sales MUST NOT own Customer existence or actor authorization policy.
    - Sales MUST NOT own physical inventory.
    - Sales MUST NOT execute payment, refund, return, shipment, or fulfillment behavior.
    - Sales MUST NOT issue invoices or define discount campaigns.

owned_aggregates:
  - sales.order

commands:
  - sales.create-order-draft
  - sales.add-order-item
  - sales.submit-order
  - sales.cancel-order

events:
  - sales.order-draft-created
  - sales.order-item-added
  - sales.order-submitted
  - sales.order-cancelled

state_machines:
  - sales.order-lifecycle

interactions:
  - customer.verify-order-authority
  - pricing.quote-order-item

explanatory_notes:
  - A submitted Order is not cancelled by this Context. Refund and Return require future contracts with Payment, Fulfillment, Shipment, or Returns.
  - Customer and Pricing are dependency boundaries only; their internal implementations are outside the Sales conformance target.
